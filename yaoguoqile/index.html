<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>药过期了</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script>
        window.BAIDU_OCR_API_KEY = 'XNQ03c64Hv46BBovLneGZqim';
        window.BAIDU_OCR_SECRET_KEY = '38qLtH1DhqijAF8glnc9SyR1y2CEsPeI';
        window.WECHAT_APPID = '';
    </script>
</head>
<body>
    <!-- 小药精灵浮动伙伴 -->
    <div id="sprite" class="sprite hidden" title="点我互动~">
        <div class="sprite-inner">
            <img id="sprite-img" src="assets/pill-cheering.jpg" alt="小药精灵" draggable="false">
        </div>
        <div class="sprite-bubble hidden" id="sprite-bubble"></div>
    </div>

    <!-- 欢迎弹窗 -->
    <div id="welcome-modal" class="modal-overlay hidden">
        <div class="modal welcome-modal">
            <div class="welcome-mascot">
                <img src="assets/pill-jumping.jpg" alt="小药精灵">
            </div>
            <h2>欢迎回来！</h2>
            <p id="welcome-msg">今天也要开开心心的哦~</p>
            <button class="primary-btn" onclick="closeWelcome()">开始使用</button>
        </div>
    </div>

    <!-- 过期提醒弹窗 -->
    <div id="expiry-modal" class="modal-overlay hidden">
        <div class="modal expiry-modal">
            <div class="modal-mascot">
                <img src="assets/pill-sad.jpg" alt="担心">
            </div>
            <h2>药品即将过期！</h2>
            <p id="expiry-msg"></p>
            <div class="modal-btns">
                <button class="primary-btn" onclick="closeExpiryModal()">我知道了</button>
                <button class="secondary-btn" onclick="closeExpiryModal();showPage('medicines-page');renderMedicineList();">查看药品</button>
            </div>
        </div>
    </div>

    <!-- 通知联系人弹窗 -->
    <div id="notify-modal" class="modal-overlay hidden">
        <div class="modal notify-modal">
            <div class="modal-mascot">
                <img src="assets/pill-thinking.jpg" alt="思考">
            </div>
            <h2>小精灵提醒</h2>
            <p id="notify-msg"></p>
            <div class="modal-btns">
                <button class="secondary-btn" onclick="closeNotifyModal()">稍后处理</button>
                <button class="primary-btn" id="notify-send-btn">通知联系人</button>
            </div>
        </div>
    </div>

    <!-- 页面容器 -->
    <div class="app-container">
        <!-- 登录页面 -->
        <div id="login-page" class="page active">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-mascot">
                        <img src="assets/pill-cheering.jpg" alt="小药精灵">
                    </div>
                    <h1>药过期了</h1>
                    <p>守护家人用药安全</p>
                </div>

                <div class="login-card">
                    <div class="login-tabs">
                        <button class="login-tab active" onclick="switchLoginTab('phone')">手机号登录</button>
                        <button class="login-tab" onclick="switchLoginTab('wechat')">微信一键登录</button>
                    </div>

                    <div id="phone-login" class="login-form">
                        <div class="form-group">
                            <label>手机号码</label>
                            <input type="tel" id="login-phone" placeholder="请输入手机号" maxlength="11">
                        </div>
                        <button class="primary-btn login-btn" onclick="handleLogin()">登录</button>
                    </div>

                    <div id="wechat-login" class="login-form hidden">
                        <button class="primary-btn login-btn" style="background:#07C160;" onclick="wechatLogin()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.322-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.03-.407-.032zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
                            微信一键登录
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 亲密联系人引导页面 -->
        <div id="contacts-guide-page" class="page">
            <div class="contacts-guide-container">
                <div class="guide-header">
                    <div class="guide-mascot">
                        <img src="assets/pill-thinking.jpg" alt="小药精灵">
                    </div>
                    <h1>添加亲密联系人</h1>
                    <p>药物过期，小药精灵会发信息给他/她，提醒您清理药箱</p>
                </div>


                <div class="guide-form">
                    <div class="form-group">
                        <label>联系人姓名</label>
                        <input type="text" id="guide-contact-name" placeholder="例如：妈妈">
                    </div>
                    <div class="form-group">
                        <label>手机号码</label>
                        <input type="tel" id="guide-contact-phone" placeholder="请输入手机号" maxlength="11">
                    </div>
                    <div class="button-group" style="margin-top:20px;">
                        <button class="secondary-btn" onclick="skipContactsGuide()">稍后再设置</button>
                        <button class="primary-btn" onclick="saveGuideContact()">确认</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- 首页 -->
        <div id="home-page" class="page">
            <div class="header">
                <h1>药过期了</h1>
                <div class="header-actions">
                    <button id="contacts-btn" class="icon-btn" onclick="showPage('contacts-page');renderContacts();">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </button>
                    <button id="settings-btn" class="icon-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </div>

            <div class="alert-card">
                <div class="alert-header">
                    <h2>过期提醒</h2>
                    <span class="alert-badge" id="alert-count">0</span>
                </div>
                <div id="expired-list" class="alert-content"></div>
            </div>
            <div class="function-grid">
                <button id="medicines-btn" class="function-card">
                    <div class="function-icon medicine-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M12 11h4"/><path d="M12 16h4"/><circle cx="8" cy="11" r=".5"/><circle cx="8" cy="16" r=".5"/></svg>
                    </div>
                    <h3>药品列表</h3>
                </button>
                <button id="quick-add-btn" class="function-card add-card">
                    <div class="function-icon add-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    </div>
                    <h3>添加药品</h3>
                </button>
            </div>
        </div>

        <!-- 药品列表页面 -->
        <div id="medicines-page" class="page">
            <div class="header">
                <button id="back-from-medicines-btn" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19L5 12l7-7"/></svg>
                </button>
                <h1>药品列表</h1>
                <button id="add-btn" class="primary-btn small">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    添加
                </button>
            </div>
            <div class="search-filter-container">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:12px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="search-input" placeholder="搜索药品名称...">
                </div>
            </div>
            <div class="medicine-list"><div id="medicine-items"></div></div>
        </div>

        <!-- 添加药品页面 -->
        <div id="add-page" class="page">
            <div class="header">
                <button id="back-btn" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19L5 12l7-7"/></svg>
                </button>
                <h1>添加药品</h1>
            </div>
            <div class="form-container">
                <!-- 图片识别栏 -->
                <div id="ocr-panel" class="ocr-panel" style="display:none;">
                    <div class="ocr-panel-header">
                        <span class="ocr-panel-title">识别结果</span>
                        <button class="ocr-panel-close" onclick="closeOcrPanel()">×</button>
                    </div>
                    <div id="ocr-raw-text" class="ocr-raw-text"></div>
                    <div class="ocr-panel-edit">
                        <input type="text" id="ocr-edit-input" placeholder="可手动修改识别结果">
                        <button class="ocr-apply-btn" onclick="applyOcrResult()">使用</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="medicine-name">药品名称</label>
                    <div class="input-with-btn">
                        <input type="text" id="medicine-name" placeholder="例如：布洛芬">
                        <button id="scan-name-btn" class="camera-btn" onclick="scanMedicineName()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="expiry-date">有效期</label>
                    <input type="date" id="expiry-date">
                </div>
                <div class="form-group">
                    <label for="storage-location">位置</label>
                    <input type="text" id="storage-location" placeholder="例如：客厅抽屉">
                </div>
                <div class="form-group">
                    <label for="quantity">数量</label>
                    <input type="number" id="quantity" min="1" value="1">
                </div>
                <button id="save-btn" class="primary-btn full-width">保存</button>
            </div>
        </div>

        <!-- 设置页面 -->
        <div id="settings-page" class="page">
            <div class="header">
                <button id="back-from-settings-btn" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19L5 12l7-7"/></svg>
                </button>
                <h1>设置</h1>
            </div>
            <div class="settings-container">
                <div class="setting-section">
                    <h3>提醒设置</h3>
                    <div class="setting-item">
                        <label for="reminder-days">提醒时间（天）</label>
                        <input type="number" id="reminder-days" min="1" max="30" value="7">
                    </div>
                    <button id="save-settings-btn" class="primary-btn full-width">保存设置</button>
                </div>
                <div class="setting-section">
                    <h3>回收站</h3>
                    <div id="recycle-bin"></div>
                    <button id="clear-recycle-btn" class="secondary-btn full-width">清空回收站</button>
                </div>
                <div class="setting-section">
                    <h3>亲人共享</h3>
                    <p>生成分享链接，让亲人查看药品信息</p>
                    <button id="share-btn" class="primary-btn full-width">生成分享链接</button>
                    <div id="share-link" class="share-link hidden"></div>
                </div>
                <div class="setting-section">
                    <button id="logout-btn" class="danger-btn full-width">退出登录</button>
                </div>
                <div class="setting-section about">
                    <h3>关于</h3>
                    <p>药过期了 v1.0</p>
                    <p>为家人健康保驾护航</p>
                </div>
            </div>
        </div>

        <!-- 编辑药品页面 -->
        <div id="edit-page" class="page">
            <div class="header">
                <button id="back-from-edit-btn" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19L5 12l7-7"/></svg>
                </button>
                <h1>编辑药品</h1>
            </div>
            <div class="form-container">
                <div class="form-group">
                    <label for="edit-medicine-name">药品名称</label>
                    <input type="text" id="edit-medicine-name">
                </div>
                <div class="form-group">
                    <label for="edit-expiry-date">有效期</label>
                    <input type="date" id="edit-expiry-date">
                </div>
                <div class="form-group">
                    <label for="edit-storage-location">位置</label>
                    <input type="text" id="edit-storage-location">
                </div>
                <div class="form-group">
                    <label for="edit-quantity">数量</label>
                    <input type="number" id="edit-quantity" min="1">
                </div>
                <div class="button-group">
                    <button id="update-btn" class="primary-btn">更新</button>
                    <button id="delete-btn" class="danger-btn">删除</button>
                </div>
            </div>
        </div>

        <!-- 亲密联系人页面 -->
        <div id="contacts-page" class="page">
            <div class="header">
                <button id="back-from-contacts-btn" class="icon-btn back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19L5 12l7-7"/></svg>
                </button>
                <h1>亲密联系人</h1>
            </div>
            <div id="contacts-page-list"></div>
            <div style="padding: 20px;">
                <div id="add-contact-form2" class="hidden">
                    <div class="form-group">
                        <label>联系人姓名</label>
                        <input type="text" id="contact-name2" placeholder="例如：妈妈">
                    </div>
                    <div class="form-group">
                        <label>手机号码</label>
                        <input type="tel" id="contact-phone2" placeholder="请输入手机号" maxlength="11">
                    </div>
                    <div class="button-group">
                        <button class="secondary-btn" onclick="cancelAddContact2()">取消</button>
                        <button class="primary-btn" onclick="addContact2()">确认添加</button>
                    </div>
                </div>
                <button class="secondary-btn full-width" id="add-contact-btn2" onclick="showAddContact2()">+ 添加联系人</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
